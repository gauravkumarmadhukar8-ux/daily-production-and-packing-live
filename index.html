<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#222;--line:#eee;--hov:#f0f6ff;--bd:#ccc;--mut:#666;--th:#e8eef7}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--txt:#eee;--line:#333;--hov:#26324a;--bd:#444;--mut:#aaa;--th:#2a3445}}
body{font-family:Arial,sans-serif;margin:0;padding:12px;background:var(--bg);color:var(--txt)}
.bar{display:flex;gap:8px;margin-bottom:6px}
input{flex:1;min-width:0;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--txt)}
button{padding:10px 16px;font-size:16px;border:0;border-radius:6px;background:#1a73e8;color:#fff}
small{color:var(--mut)}
.box{background:var(--card);border-radius:8px;padding:8px;margin-bottom:12px;overflow:auto}
#top{box-sizing:border-box}
.hh{display:flex;align-items:center;gap:12px}
.x{padding:6px 12px;font-size:14px;background:#d93025}
.hist{display:flex;flex-wrap:wrap;gap:12px}
.hist>div{flex:1 1 300px;max-height:50vh}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--th);position:sticky;top:0}
th.a{background:#1a73e8;color:#fff}
th.p{background:#f9c923;color:#000}
th.d{background:#f57c00;color:#fff}
th.b{background:#2e7d32;color:#fff}
.n{text-align:right}
tr.s{cursor:pointer}tr.s:hover{background:var(--hov)}
</style></head>
<body>
<div class="bar">
  <input id="q" placeholder="Search APL..." oninput="hide=false;draw()">
  <button onclick="load()">Refresh</button>
</div>
<small id="upd"></small>
<div class="box" id="top"><div id="sum"></div></div>
<div id="det"></div>

<script>
let D = {stock:[],prod:[],disp:[]}, sel = null, hide = false;
const $ = id => document.getElementById(id);
const fit = () => { const t = $('top'), r = innerHeight - t.offsetTop - 24; t.style.height = (t.classList.contains('sm') ? r * .4 : r) + 'px'; };
onresize = fit;
const tbl = (h, rows) => `<table><tr>${h.map(([t,c]) => `<th class="${c}">${t}</th>`).join('')}</tr>${rows.join('')}</table>`;

function load() {
  $('upd').textContent = 'Updating...';
  fetch('https://script.google.com/macros/s/AKfycbzJpKMMgl3n2NS5UH-LHz6h0QBT75X4lgEdX-jSG4_Xj1uYmBGppylNJdarlWsdM_8/exec?data=1')
    .then(r => r.json())
    .then(d => { D = d; draw(); $('upd').textContent = 'Last updated: ' + new Date().toLocaleTimeString(); })
    .catch(e => $('upd').textContent = 'Error: ' + e.message);
}

function pick(a) { hide = false; sel = sel === a ? null : a; draw(); }

function draw() {
  const q = $('q').value.trim().toLowerCase();
  const list = D.stock.filter(s => s.apl.toLowerCase().includes(q));
  const one = hide ? null : (sel && list.find(s => s.apl === sel) ? sel : (list.length === 1 ? list[0].apl : null));
  const rows = list.map(s => `<tr class="s" onclick="pick('${s.apl.replace(/'/g,"\\'")}')"><td>${s.apl}</td><td class="n">${s.prod}</td><td class="n">${s.disp}</td><td class="n"><b>${s.prod - s.disp}</b></td></tr>`);
  $('sum').innerHTML = tbl([['APL','a'],['Production','n p'],['Dispatch','n d'],['Balance','n b']], rows);
  $('top').classList.toggle('sm', !!one);
  fit();
  const h = arr => arr.filter(r => r[1] === one).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td></tr>`);
  $('det').innerHTML = one ? `<div class="hh"><h3>${one}</h3><button class="x" onclick="sel=null;hide=true;draw()">&times; Close</button></div><div class="hist">
    <div class="box"><h4>Production History</h4>${tbl([['Date','p'],['APL','a'],['Qty','n p']], h(D.prod))}</div>
    <div class="box"><h4>Dispatch History</h4>${tbl([['Date','d'],['APL','a'],['Qty','n d']], h(D.disp))}</div></div>` : '';
}

fit(); load(); setInterval(load, 60000);
</script>
</body></html>
